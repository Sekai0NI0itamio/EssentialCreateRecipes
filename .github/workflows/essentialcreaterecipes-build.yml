name: Build Essential Create Recipes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mods/essentialcreaterecipes/1.20.1-forge
            java: '17'
            gradle: '8.14.3'
            artifact: essentialcreaterecipes-1.20.1-forge
          - module: mods/essentialcreaterecipes/1.20.1-fabric
            java: '21'
            gradle: '9.5.0'
            artifact: essentialcreaterecipes-1.20.1-fabric

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        working-directory: ${{ matrix.module }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
